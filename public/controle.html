<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFFBF3">
  <title>Controle · Missão, Jogos e Aventuras</title>
  <link rel="icon" href="assets/ui/ic_bussola.png">
  <link rel="stylesheet" href="css/base.css">
  <script src="vendor/peerjs/peerjs.min.js"></script>
  <style>
    body { background: url("assets/fundos/lobby/longe.png") center / cover; touch-action: none; }
    .pagina { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 2vh; padding: max(12px, env(safe-area-inset-top)) 16px; text-align: center; overflow: auto; }
    .logo { width: min(56vw, 30vh); }
    .btn { font-size: 18px; padding: 10px 26px; }
    input { font: 600 22px Fredoka, sans-serif; padding: 12px 18px; border-radius: 999px; border: 3px solid var(--marinho);
            text-align: center; width: min(80vw, 340px); outline: none; color: var(--marinho); }
    h2 { font-size: 22px; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(96vw, 560px); }
    .cards > div { position: relative; background: #fff; border-radius: 14px; overflow: hidden; border: 3px solid transparent; box-shadow: var(--sombra); }
    .cards .faixa { color: #fff; font: 700 11px Fredoka, sans-serif; padding: 4px 0; }
    .cards .arte { height: min(110px, 28vh); display: grid; place-items: center; padding: 4px; }
    .cards .arte img { width: 100%; height: calc(min(110px, 28vh) - 8px); object-fit: contain; }
    .cards .livre .arte img { filter: grayscale(.6); opacity: .55; }
    .cards .meu { border-color: var(--marinho); }
    .cards small { display: block; font: 600 12px Fredoka, sans-serif; padding: 2px 0 6px; }
    .msg { font: 600 15px Fredoka, sans-serif; max-width: 92vw; }

    .itens { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .item { padding: 10px 12px; width: 150px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 14px Fredoka, sans-serif; }
    .item .ic { height: 42px; }
    .item .preco { display: flex; align-items: center; gap: 4px; }
    .item .preco img { height: 20px; }
    .item button { font: 700 14px Fredoka, sans-serif; border: 0; border-radius: 999px; padding: 4px 12px 4px 4px;
                   color: #fff; display: flex; align-items: center; gap: 6px; }
    .item button img { height: 26px; border-radius: 50%; border: 2px solid #fff; }
    .item button:disabled { filter: grayscale(.9); opacity: .4; }
    .item button.cheio:disabled { filter: none; opacity: 1; }

    /* controle em jogo: fundo neutro, botões redondos na cor do time */
    #jogo { background: var(--creme); justify-content: space-between; flex-direction: row; padding: max(14px, env(safe-area-inset-left)); overflow: hidden; }
    #jogo .lado { display: flex; gap: 4vw; align-items: flex-end; height: 100%; padding-bottom: 5vh; }
    #jogo .direita { flex-direction: column; align-items: flex-end; justify-content: flex-end; gap: 3vh; }
    #jogo .direita .linha { display: flex; gap: 4vw; align-items: flex-end; }
    .ctl { width: min(25vh, 20vw); aspect-ratio: 1; border-radius: 50%; background: var(--cor, var(--azul)) center / 55% no-repeat;
           box-shadow: 0 1.2vh 0 color-mix(in srgb, var(--cor, var(--azul)) 60%, #1E2A4A); transition: transform .06s; }
    .ctl.on { transform: translateY(1vh); box-shadow: 0 .2vh 0 color-mix(in srgb, var(--cor, var(--azul)) 60%, #1E2A4A); filter: brightness(.92); }
    .ctl.grande { width: min(31vh, 25vw); }
    .ctl.pequeno { width: min(17vh, 13vw); }
    #topo { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex;
            align-items: center; gap: 10px; color: #fff; font: 700 17px Fredoka, sans-serif; border-radius: 999px;
            padding: 4px 16px 4px 4px; white-space: nowrap; box-shadow: var(--sombra); }
    #topo img.r { height: 46px; border-radius: 50%; border: 2px solid #fff; background: #fff; }
    #topo img.r.inativo { height: 30px; opacity: .6; }
    #topo .cor { display: flex; gap: 2px; background: #fff; border-radius: 999px; padding: 3px 6px; }
    #topo .cor img { height: 16px; }
    #girar { display: none; position: fixed; inset: 0; background: var(--creme); z-index: 9; flex-direction: column;
             align-items: center; justify-content: center; gap: 16px; font: 700 22px Fredoka, sans-serif; text-align: center; padding: 24px; }
    @media (orientation: portrait) { #jogo:not(.oculto) ~ #girar { display: flex; } }
    #girar .icone { font-size: 64px; animation: gira 1.6s ease-in-out infinite; }
    @keyframes gira { 50% { transform: rotate(-90deg); } }
  </style>
</head>
<body>
  <div id="pgNome" class="pagina">
    <img class="logo" src="assets/kit/logo.png" alt="Missão, Jogos e Aventuras">
    <input id="codigo" class="oculto" maxlength="4" placeholder="Código da sala" autocomplete="off" autocapitalize="characters">
    <input id="nome" maxlength="14" placeholder="Seu nome" autocomplete="off">
    <button class="btn grande" id="btnEntrar">Entrar</button>
    <div class="msg" id="msgNome"></div>
  </div>

  <div id="pgLobby" class="pagina oculto">
    <h2>Escolha seu time</h2>
    <div class="cards" id="cards"></div>
    <div class="msg" id="msgLobby"></div>
    <button class="btn" id="btnLoja">Jogar</button>
  </div>

  <div id="pgLoja" class="pagina oculto">
    <h2>Oficina da equipe · <span class="pilula" style="font-size:16px"><img src="assets/ui/ic_bloco.png" style="height:20px"><span id="carteira">0</span> peças</span></h2>
    <div class="msg" id="msgLoja"></div>
    <div class="itens" id="itens"></div>
    <button class="btn" id="btnJogar">Começar fase</button>
  </div>

  <div id="jogo" class="pagina oculto">
    <div id="topo"></div>
    <div class="lado">
      <div class="ctl" data-k="esq"></div>
      <div class="ctl" data-k="dir"></div>
    </div>
    <div class="lado direita">
      <div class="ctl pequeno" data-k="trocar" id="ctlTrocar"></div>
      <div class="linha">
        <div class="ctl pequeno" data-k="acao"></div>
        <div class="ctl grande" data-k="pulo"></div>
      </div>
    </div>
  </div>
  <div id="girar"><div class="icone">📱</div>Vire o celular de lado para jogar</div>

  <div id="pgFim" class="pagina oculto">
    <h2 id="fimTitulo" style="font-size:32px"></h2>
    <div class="msg" id="fimMsg"></div>
    <button class="btn grande" id="btnContinuar">Continuar</button>
    <button class="btn claro" id="btnMenu">Menu</button>
  </div>

  <script type="module" src="js/controle.js"></script>
</body>
</html>
